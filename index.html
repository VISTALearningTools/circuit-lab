<!-- VISTA Circuit Lab v0.2.0 public release. © 2026 VISTA Learning Tools. All rights reserved. -->

<style>
:root{
  --bg:#f5f7fb; --panel:#fff; --soft:#f8faff; --text:#182033; --muted:#6c7688; --border:#d8deea;
  --shadow:0 8px 26px rgba(25,35,58,.09); --radius:16px;
  --series:#78c2e7; --series-soft:#def1fb; --series-deep:#1f85bd;
  --parallel:#8e60ca; --parallel-soft:#efe7fb; --parallel-deep:#67419d;
  --given:#fff7df; --given-border:#ecd89e; --entered:#edf8f2; --entered-border:#bce0ca;
  --unknown:#f8fafc; --unknown-border:#d8deea;
  --accent:#4568dc; --good:#246b49; --warn:#9a5a1b; --bad:#9c3f3f;
  --cell-w:198px; --label-w:72px; --row-h:82px; --head-h:46px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:1600px;margin:0 auto;padding:10px 14px 16px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.brand h1{margin:0;font-size:22px}.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.version{font-size:11px;font-weight:850;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:999px;padding:5px 9px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.control{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:5px 9px}
.control label{font-size:11px;color:var(--muted);font-weight:850}.control input,.control select{border:0;background:transparent;outline:0;font-weight:850;color:var(--text)}
button{font:inherit;min-height:35px;padding:7px 11px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);cursor:pointer}
button:hover{border-color:#b9c4d6}button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:850}
button:focus-visible,input:focus-visible,select:focus-visible,.switch:focus-visible{outline:3px solid rgba(69,104,220,.17);outline-offset:2px}

.layout{display:grid;grid-template-columns:minmax(0,1.83fr) 390px;gap:10px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-head{padding:10px 12px 6px}.panel-head h2{margin:0;font-size:15px}.panel-head p{margin:2px 0 0;font-size:10.5px;color:var(--muted)}
.workspace-body{padding:0 12px 10px}

/* schematic */
.circuit-stage{min-height:275px;padding:6px 8px;border:1px solid var(--border);border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
svg{max-width:100%;height:auto}.wire,.resistor,.battery{stroke:#3d4656;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.comp{cursor:pointer}.comp .focus{stroke:#48a176;stroke-width:12;opacity:0;stroke-linecap:round}.comp.selected .focus{opacity:1}
.schem-label{font-size:14px;font-weight:900;fill:#182033}.schem-value{font-size:12px;font-weight:800;fill:#637088}
.current{stroke:#2f6eb0;stroke-width:4;fill:none;marker-end:url(#arr)}.current-label{font-size:13px;font-weight:900;fill:#2f6eb0}

/* analysis area */
.analysis-board{position:relative;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(315px,.65fr);gap:10px;margin-top:8px;align-items:start;overflow:visible}
.matrix-zone,.rules-zone{min-width:0;position:relative;z-index:2}
.matrix-head,.ref-head{height:34px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:4px}
.matrix-head h3,.ref-head h3{margin:0;font-size:13px}.matrix-head span,.ref-head span{font-size:9.5px;color:var(--muted)}
.matrix-scroll{overflow-x:auto;overflow-y:hidden;padding-bottom:3px}.matrix-content{width:max-content;min-width:100%}
.matrix{display:grid;gap:5px}.matrix-row{display:grid;grid-template-columns:var(--label-w) repeat(var(--cols),var(--cell-w));gap:5px;height:var(--row-h)}.matrix-row.header{height:var(--head-h);align-items:end}
.mhead{font-size:10px;color:var(--muted);font-weight:900;text-align:center;padding:0 4px 4px}.mhead:first-child{text-align:left}
.rowlabel{display:flex;flex-direction:column;justify-content:center;padding-left:3px}.rowbig{font-size:21px;font-weight:900}.rowsmall{font-size:8.5px;color:var(--muted);margin-top:2px}
.data-cell{position:relative;border:1px solid var(--unknown-border);border-radius:11px;background:var(--unknown);padding:8px;display:grid;grid-template-columns:46px minmax(88px,1fr) 68px;gap:6px;align-items:center;overflow:hidden}
.data-cell.given{background:var(--given);border-color:var(--given-border)}.data-cell.entered{background:var(--entered);border-color:var(--entered-border)}
.data-cell.selected{box-shadow:0 0 0 3px rgba(69,104,220,.16);border-color:#b6c3ff}
.varlabel{font-size:21px;font-weight:900;display:flex;align-items:center;justify-content:flex-start;height:100%;white-space:nowrap}.varlabel sub{font-size:.55em;line-height:1;position:relative;top:.34em;margin-left:1px;font-weight:900}
.value-wrap{min-width:0;display:flex;flex-direction:column;gap:3px}
.value-input{width:100%;min-width:0;height:42px;border:1px solid #bcc6d5;border-radius:10px;background:#fff;padding:7px 8px;font-size:14px;font-weight:850;color:var(--text);box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
.value-input::placeholder{color:#8993a5;font-size:11px;font-weight:800;letter-spacing:.2px}
.unit-radios{display:grid;gap:2px;align-self:center}.unit-choice{display:flex;align-items:center;gap:3px;font-size:9px;font-weight:900;color:#4b566a;cursor:pointer;white-space:nowrap}.unit-choice input{appearance:none;width:12px;height:12px;border:1.5px solid #9ba7b8;border-radius:50%;margin:0;background:#fff;position:relative}.unit-choice input:checked{border-color:#4568dc}.unit-choice input:checked::after{content:"";position:absolute;inset:2px;border-radius:50%;background:#4568dc}

/* Ohm calculators */
.ohm-title{font-size:11px;font-weight:900;margin:8px 0 4px}.ohm-row{display:grid;grid-template-columns:var(--label-w) repeat(var(--cols),var(--cell-w));gap:5px;align-items:stretch}
.ohm-card{border:1px solid var(--border);border-radius:11px;background:#fff;padding:7px;min-height:182px;overflow:hidden}.ohead{font-size:8.5px;font-weight:900;color:var(--muted);margin-bottom:5px}
.ohm-select{width:100%;height:33px;border:1px solid #c5cedb;border-radius:8px;background:#fff;padding:0 5px;font-size:10px;font-weight:850;color:var(--text)}
.ohm-inputs{display:grid;gap:5px;margin-top:6px}.mini-field{display:grid;grid-template-columns:18px minmax(0,1fr) 58px;gap:4px;align-items:center}
.mini-field label{font-size:10px;font-weight:900}.mini-field input{width:100%;min-width:0;height:30px;border:1px solid #c8d0dc;border-radius:7px;padding:4px 6px;font-size:11px;font-weight:800}.mini-unit-select{width:58px;height:30px;border:1px solid #c8d0dc;border-radius:7px;background:#fff;font-size:9px;font-weight:850;padding:0 2px}
.ohm-result{margin-top:5px;padding:5px 6px;border-radius:8px;background:#f4f7fb;border:1px solid #e0e5ed;font-size:9.5px;line-height:1.25;min-height:30px}
.use-result{margin-top:4px;min-height:26px;padding:3px 6px;font-size:9px;width:100%}

/* rule reference */
.tabs-band{height:var(--head-h);display:flex;align-items:flex-end}.tabs-row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);gap:7px;align-items:end}
.tab{border-bottom:0;border-radius:18px 18px 0 0;min-height:39px;font-size:13px;font-weight:900;background:#eef2f7;color:#5a6577}.tab.active.series{background:var(--series);border-color:#9fd1e9;color:#fff}.tab.active.parallel{background:var(--parallel);border-color:#cbb8e7;color:#fff}
.switch-slot{display:flex;justify-content:center;padding-bottom:4px}.switch{width:64px;height:33px;border-radius:999px;background:#d7dce6;border:1px solid #c1c8d3;position:relative;cursor:pointer}.knob{position:absolute;top:4px;left:6px;width:23px;height:23px;border-radius:50%;background:var(--series);box-shadow:0 2px 5px rgba(0,0,0,.16);transition:.18s}.switch.parallel .knob{left:34px;background:var(--parallel)}
.rule-rows{display:grid;grid-template-rows:repeat(3,var(--row-h));gap:5px}
.rule-row{position:relative;border:1px solid var(--border);background:#fff;display:grid;grid-template-columns:42px 1fr;align-items:center;border-radius:10px;overflow:hidden}
.rule-key{height:100%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;border-right:1px solid var(--border);color:#1f2b43}
.rule-copy{position:relative;height:100%;min-width:0}.rule-hidden,.rule-reveal{position:absolute;inset:0;padding:8px;line-height:1.17;user-select:none}.rule-hidden{color:transparent}.rule-reveal{color:var(--text);clip-path:inset(0 0 100% 0);pointer-events:none}.rule-hidden .rname,.rule-reveal .rname{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.3px}.rule-hidden .req,.rule-reveal .req{font-size:12px;font-weight:900;margin-top:2px}.rule-hidden .rdesc,.rule-reveal .rdesc{font-size:9px;margin-top:3px}

/* draggable lenses */
.lens{position:absolute;z-index:9;pointer-events:none;border-radius:10px;box-shadow:0 4px 12px rgba(31,44,67,.12)}
.rule-lens{left:0;top:84px;width:100%;height:var(--row-h);background:rgba(83,176,219,.42);border:1px solid rgba(45,125,170,.35);backdrop-filter:saturate(1.08)}
.ohm-lens{left:78px;top:84px;width:var(--cell-w);height:calc(var(--row-h) * 3 + 5px * 2 + 196px);background:rgba(255,210,62,.28);border:1px solid rgba(204,158,0,.38)}
.lens-handle{pointer-events:auto;position:absolute;background:#fff;border:1px solid #b9c5d5;color:#42516a;border-radius:999px;padding:4px 8px;font-size:8.5px;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.10);cursor:grab;white-space:nowrap}
.lens-handle:active{cursor:grabbing}.rule-lens .lens-handle{left:7px;top:6px}.ohm-lens .lens-handle{left:50%;top:6px;transform:translateX(-50%)}.lens-collapse{pointer-events:auto;position:absolute;right:6px;top:6px;width:24px;height:24px;min-height:24px;padding:0;border-radius:8px;background:rgba(255,255,255,.92);font-size:12px;font-weight:900}.lens.collapsed{width:34px!important;height:34px!important;background:rgba(255,255,255,.2)}.lens.collapsed .lens-handle{display:none}.lens.collapsed .lens-collapse{right:4px;top:4px}.joint-handle{position:absolute;z-index:12;width:17px;height:17px;border-radius:50%;background:#fff;border:2px solid #53657f;box-shadow:0 2px 7px rgba(0,0,0,.14);cursor:move;pointer-events:auto;transform:translate(-50%,-50%)}.joint-handle::after{content:"";position:absolute;inset:4px;border-radius:50%;background:#ffd54a}.joint-handle.hidden{display:none}
.lens.parked{opacity:.18}.lens.parked .lens-handle{opacity:1}
.lens-toolbar{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.lens-toolbar button{min-height:29px;padding:4px 7px;font-size:9px}


/* v0.1.13 aligned horizontal rule checks */
.rule-work-grid{display:grid;grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr);gap:7px;align-items:start}
.rule-ref-column,.rule-check-column{min-width:0}
.rule-check-head{height:var(--head-h);display:flex;align-items:flex-end;padding:0 2px 5px;font-size:10px;font-weight:900;color:var(--muted)}
.rule-checks{display:grid;grid-template-rows:repeat(3,var(--row-h));gap:5px}
.rule-check-card{height:var(--row-h);border:1px solid var(--border);border-radius:10px;background:#fff;padding:5px 6px;display:grid;grid-template-rows:14px 34px 22px;gap:2px;overflow:hidden}
.rule-check-card.series.pass{background:var(--series-soft)}.rule-check-card.parallel.pass{background:var(--parallel-soft)}
.rule-check-card.rounding{box-shadow:inset 0 0 0 2px #e6b95e}.rule-check-card.fail{box-shadow:inset 0 0 0 2px #df9a9a}
.rule-check-title{font-size:8px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4d596d}
.rule-check-inputs{display:flex;gap:3px;overflow-x:auto;overflow-y:hidden;align-items:center;padding-bottom:1px}
.rule-mini{flex:0 0 58px;display:grid;grid-template-columns:1fr 18px;grid-template-rows:10px 22px;gap:1px 2px;align-items:center}
.rule-mini label{grid-column:1/3;font-size:7px;font-weight:900;color:#657187;white-space:nowrap}.rule-mini label sub{font-size:.72em}
.rule-mini input{width:100%;min-width:0;height:22px;border:1px solid #c6cedb;border-radius:6px;padding:2px 4px;font-size:9px;font-weight:800}
.rule-mini .unit{font-size:7px;font-weight:900;color:#5e697b;text-align:center}
.rule-check-footer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;align-items:center;min-width:0}
.rule-check-result{font-size:7.5px;line-height:1.1;color:#697487;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rule-check-actions{display:flex;gap:3px}.rule-check-actions button{min-height:20px;height:20px;padding:1px 5px;font-size:7px;border-radius:6px}
@keyframes updatedPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(69,104,220,0)}50%{transform:scale(1.035);box-shadow:0 0 0 5px rgba(69,104,220,.18)}}
.value-input.updated-pulse{animation:updatedPulse .52s ease-in-out 2}

/* right side */
.side{display:grid;gap:10px}.guide-body,.verify-body{padding:0 10px 10px}.card{background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:10px}
.step{font-size:9px;font-weight:900;color:#3d5ec3;text-transform:uppercase;letter-spacing:.35px}.prompt{font-size:13px;font-weight:850;margin-top:2px}.sub{font-size:10px;color:var(--muted);line-height:1.3;margin-top:2px}
.type-choices{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.typebtn{min-height:40px;font-weight:900}.typebtn.series{background:var(--series-soft);border-color:#a5d5ee;color:#196fa5}.typebtn.parallel{background:var(--parallel-soft);border-color:#d2c1eb;color:var(--parallel-deep)}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.actions button{min-height:31px;font-size:10px;padding:5px 7px}
.feedback{display:none;margin-top:6px;padding:7px 8px;border-radius:9px;font-size:10px;line-height:1.3}.feedback.show{display:block}.feedback.good{background:#eaf7f0;border:1px solid #bfe3cf;color:var(--good)}.feedback.warn{background:#fff7e8;border:1px solid #ecd4a8;color:var(--warn)}.feedback.bad{background:#fff0f0;border:1px solid #e4b9b9;color:var(--bad)}
.progress{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.pchip{font-size:8.5px;font-weight:850;border-radius:999px;padding:3px 6px;background:#edf1f6;color:#687388;border:1px solid var(--border)}.pchip.active{background:#e7ecff;border-color:#bdc8ff;color:#3550ad}.pchip.done{background:#eaf7f0;border-color:#bfe3cf;color:#236847}
.verify-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.verify-box{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px}.verify-box h4{font-size:10px;margin:0 0 4px}.verify-status{font-size:9.5px;color:#606c80;line-height:1.3}.confidence{margin-top:6px;font-size:10px;font-weight:900}
.footer{text-align:center;font-size:9px;color:var(--muted);margin-top:5px}

@media(max-width:1200px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr}}
@media(max-width:900px){.analysis-board{grid-template-columns:1fr}.rule-lens,.ohm-lens{display:none}}

/* v0.1.15 — use the full page width for the analysis workspace */
.analysis-panel{margin-top:10px;overflow:visible}
.analysis-panel-body{padding:10px 12px 12px}
.analysis-board{
  width:100%;
  grid-template-columns:minmax(0,1.62fr) minmax(360px,.38fr);
  gap:12px;
  margin-top:0;
}
.matrix-scroll{overflow-x:hidden;overflow-y:visible;padding-bottom:0}
.matrix-content{width:100%!important;min-width:0!important}
.matrix-row,.ohm-row{
  grid-template-columns:var(--label-w) repeat(var(--cols),minmax(0,1fr));
}
.data-cell{
  grid-template-columns:34px minmax(0,1fr) 38px;
  gap:5px;
  padding:7px 6px;
}
.varlabel{font-size:19px}
.value-input{height:40px;padding:6px 7px;font-size:13px}
.unit-radios{gap:1px}
.unit-choice{gap:2px;font-size:8px}
.unit-choice input{width:10px;height:10px}
.ohm-card{min-width:0}
.rule-work-grid{grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr)}
@media(max-width:1350px){
  .analysis-board{grid-template-columns:minmax(0,1.55fr) minmax(330px,.45fr)}
  .data-cell{grid-template-columns:31px minmax(0,1fr) 35px;padding:6px 5px}
  .varlabel{font-size:18px}
  .unit-choice{font-size:7.5px}
}
@media(max-width:1080px){
  .analysis-board{grid-template-columns:1fr}
  .matrix-scroll{overflow-x:auto}
  .matrix-content{width:max-content!important;min-width:100%!important}
  .matrix-row,.ohm-row{grid-template-columns:var(--label-w) repeat(var(--cols),var(--cell-w))}
}


/* v0.1.15 — compact matrix cells to preserve room for the rule reference */
.analysis-board{
  grid-template-columns:minmax(0,1.28fr) minmax(430px,.72fr);
  gap:10px;
}
.matrix-row,.ohm-row{
  grid-template-columns:56px repeat(var(--cols),minmax(132px,1fr));
  gap:4px;
}
.matrix thead th:first-child,.mhead:first-child{width:56px}
.data-cell{
  grid-template-columns:28px minmax(72px,1fr) 30px;
  gap:4px;
  padding:6px 5px;
  border-radius:10px;
}
.varlabel{font-size:18px}
.value-input{
  height:38px;
  min-width:0;
  padding:5px 6px;
  font-size:12px;
  border-radius:9px;
}
.value-input::placeholder{
  font-size:9.5px;
  letter-spacing:0;
}
.unit-radios{gap:0;align-self:center}
.unit-choice{gap:1px;font-size:7.5px;line-height:1.05}
.unit-choice input{width:9px;height:9px;margin:0}
.ohm-card{padding:6px;min-width:0}
.ohm-select{font-size:9px;padding:0 4px}
.mini-field{grid-template-columns:16px minmax(0,1fr) 20px;gap:3px}
.mini-field input{min-width:0;padding:3px 4px}
.rule-work-grid{grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr)}

/* Let the matrix use the available width first; scroll only when the resistor count truly needs it. */
.matrix-scroll{overflow-x:auto;overflow-y:visible}
.matrix-content{min-width:0!important}
@media(min-width:1081px){
  .matrix-content{width:100%!important}
}
@media(max-width:1350px) and (min-width:1081px){
  .analysis-board{grid-template-columns:minmax(0,1.18fr) minmax(400px,.82fr)}
  .matrix-row,.ohm-row{grid-template-columns:52px repeat(var(--cols),minmax(118px,1fr))}
  .data-cell{grid-template-columns:26px minmax(66px,1fr) 28px;padding:5px 4px}
  .varlabel{font-size:17px}
  .value-input{font-size:11.5px}
}


/* v0.1.16 — compact matrix + formula-style aligned rule checks */
.analysis-board{
  grid-template-columns:minmax(0,1fr) minmax(520px,.78fr);
  gap:10px;
}
.matrix-row,.ohm-row{
  grid-template-columns:46px repeat(var(--cols),minmax(108px,1fr));
  gap:3px;
}
.matrix thead th:first-child,.mhead:first-child{width:46px}
.data-cell{
  grid-template-columns:24px 8px minmax(56px,1fr) 27px;
  gap:3px;
  padding:5px 4px;
  border-radius:9px;
}
.varlabel{font-size:17px;justify-content:center}
.equals-sign{font-size:15px;font-weight:900;text-align:center;color:#536078}
.value-input{height:36px;padding:4px 5px;font-size:11px;border-radius:8px}
.value-input::placeholder{font-size:9px}
.unit-radios{gap:0;justify-content:center}
.unit-choice{gap:0;font-size:7px;line-height:1}.unit-choice input{width:8px;height:8px;margin:0}

.rule-work-grid{grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);gap:6px}
.rule-check-card{
  height:var(--row-h);
  padding:5px 7px;
  display:grid;
  grid-template-rows:14px 38px 20px;
  gap:2px;
  overflow:hidden;
}
.rule-check-title{font-size:8.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rule-formula{
  display:flex;align-items:center;gap:3px;min-width:0;overflow-x:auto;overflow-y:hidden;padding:1px 0 2px;
